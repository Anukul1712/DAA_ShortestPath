[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimacs-mobility-shortest-path"
version = "1.0.0"
description = "Reproducible Dijkstra and A* experiments on DIMACS road networks"
readme = "SOLUTION_README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8,<4"]

[project.scripts]
shortest-path = "shortest_path.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

